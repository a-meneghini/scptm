[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scptm-bow"
version = "0.2.0"
description = """SCPTM-bow: structure-aware topic modelling without neural embeddings —
dependency-regularised NMF over a lemmatised bag of words, with fastText word
vectors and MWE extraction from the dependency graph."""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alessandro Meneghini", email = "alessandro.meneghini@uniud.it" }]
keywords = [
    "topic-modeling", "nmf", "dependency-parsing", "fasttext",
    "multiword-expressions", "syntax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately no torch / torch-geometric / sentence-transformers.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "tqdm>=4.65",
]

[project.scripts]
scptm-bow = "scptm_bow.cli:main"

[project.optional-dependencies]
# Lemmatisation + dependency parsing. One of the two is required at runtime.
spacy = ["spacy>=3.5"]
udpipe = ["ufal.udpipe>=1.3"]
# fastText word vectors (falls back to PPMI+SVD when absent).
vectors = ["gensim>=4.3"]
# 2D semantic-space figures.
plots = ["matplotlib>=3.7", "umap-learn>=0.5"]
# Everything needed to actually run the pipeline.
full = ["spacy>=3.5", "ufal.udpipe>=1.3", "gensim>=4.3", "matplotlib>=3.7", "umap-learn>=0.5"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scptm_bow*"]

# lint config lives at the monorepo root (ruff.toml)
