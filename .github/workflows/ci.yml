name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check packages/scptm/src packages/scptm-bow/src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/scptm/[dev]"
          pip install -e "packages/scptm-bow/[dev]"
      - name: Conformance fixture must be reproducible
        run: python conformance/make_fixture.py
      - name: scptm tests
        run: |
          for f in packages/scptm/tests/test_*.py; do
            echo "== $f"; python "$f" || exit 1
          done
        env:
          HF_HOME: ${{ runner.temp }}/hf
          MPLBACKEND: Agg
      - name: scptm-bow tests
        run: |
          for f in packages/scptm-bow/tests/test_*.py; do
            echo "== $f"; python "$f" || exit 1
          done
        env:
          MPLBACKEND: Agg
